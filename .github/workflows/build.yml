name: Build Jollygood Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    name: Build Jollygood Windows x64
    runs-on: ubuntu-22.04

    env:
      PREFIX: ${{ github.workspace }}/local
      HOST: x86_64-w64-mingw32

    steps:

      # ============================================================
      # SOURCE
      # ============================================================

      - name: Checkout Jollygood
        uses: actions/checkout@v4

      # ============================================================
      # DEPENDENCIES
      # ============================================================

      - name: Install MinGW and build dependencies
        run: |
          sudo dpkg --add-architecture amd64

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            make \
            pkg-config \
            git \
            autoconf \
            automake \
            libtool \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            mingw-w64-tools \
            nsis

      # ============================================================
      # VERIFY CROSS COMPILER
      # ============================================================

      - name: Verify MinGW compiler
        run: |
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          x86_64-w64-mingw32-ld --version
          x86_64-w64-mingw32-ar --version

      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Create local installation directories
        run: |
          mkdir -p "$PREFIX/bin"
          mkdir -p "$PREFIX/lib"
          mkdir -p "$PREFIX/include"
          mkdir -p "$PREFIX/lib/pkgconfig"
          mkdir -p "$PREFIX/share/pkgconfig"

      # ============================================================
      # BUILD JG
      #
      # The previous build failed here:
      #
      # Package jg was not found
      #
      # We build/install JG first and explicitly provide jg.pc.
      # ============================================================

      - name: Clone Jolly Good API
        run: |
          rm -rf "$HOME/jg"
          git clone --depth 1 \
            https://gitlab.com/jgemu/jg.git \
            "$HOME/jg"

      - name: Inspect JG source
        run: |
          cd "$HOME/jg"

          echo "===== JG files ====="
          find . -maxdepth 2 -type f | sort | head -200

          echo "===== JG Makefile ====="
          sed -n '1,240p' Makefile

      - name: Build JG for Windows
        working-directory: ${{ env.HOME }}/jg
        env:
          CC: x86_64-w64-mingw32-gcc
          AR: x86_64-w64-mingw32-ar
          RANLIB: x86_64-w64-mingw32-ranlib
          STRIP: x86_64-w64-mingw32-strip
        run: |
          make clean || true

          make \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP"

      - name: Install JG
        working-directory: ${{ env.HOME }}/jg
        env:
          CC: x86_64-w64-mingw32-gcc
          AR: x86_64-w64-mingw32-ar
          RANLIB: x86_64-w64-mingw32-ranlib
          STRIP: x86_64-w64-mingw32-strip
        run: |
          make install \
            PREFIX="$PREFIX" \
            CC="$CC" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP"

      # ============================================================
      # LOCATE jg.pc
      # ============================================================

      - name: Locate jg.pc
        run: |
          echo "Searching for jg.pc..."

          find "$PREFIX" \
            -name "jg.pc" \
            -print || true

          find "$HOME/jg" \
            -name "jg.pc" \
            -print || true

      # ============================================================
      # FIX PKG-CONFIG
      #
      # IMPORTANT:
      # pkg-config must see the Windows JG installation.
      # ============================================================

      - name: Configure pkg-config for JG
        run: |
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" >> "$GITHUB_ENV"

          echo "PATH=$PREFIX/bin:$PATH" >> "$GITHUB_ENV"

      # ============================================================
      # VERIFY JG
      # ============================================================

      - name: Verify JG pkg-config
        run: |
          echo "=========================================="
          echo "PKG_CONFIG_PATH"
          echo "=========================================="

          echo "$PKG_CONFIG_PATH"

          echo "=========================================="
          echo "JG PACKAGE"
          echo "=========================================="

          pkg-config --modversion jg

          echo "=========================================="
          echo "JG CFLAGS"
          echo "=========================================="

          pkg-config --cflags jg

          echo "=========================================="
          echo "JG LIBS"
          echo "=========================================="

          pkg-config --libs jg

      # ============================================================
      # BUILD JOLLYGOOD
      # ============================================================

      - name: Clean Jollygood
        run: |
          make clean || true
          rm -rf objs
          rm -rf shaders

      - name: Build Jollygood Windows x64
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          AR: x86_64-w64-mingw32-ar
          LD: x86_64-w64-mingw32-ld
          STRIP: x86_64-w64-mingw32-strip
          RANLIB: x86_64-w64-mingw32-ranlib
          PKG_CONFIG: pkg-config

        run: |
          echo "=========================================="
          echo "Building Jollygood"
          echo "=========================================="

          echo "CC=$CC"
          echo "PKG_CONFIG=$PKG_CONFIG"

          pkg-config --modversion jg

          make \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            LD="$LD" \
            STRIP="$STRIP" \
            RANLIB="$RANLIB" \
            PKG_CONFIG="$PKG_CONFIG"

      # ============================================================
      # FIND EXECUTABLE
      # ============================================================

      - name: Find Jollygood executable
        run: |
          echo "=========================================="
          echo "Searching for jollygood.exe"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -iname "jollygood.exe" \
              -o \
              -iname "jollygood" \
            \) \
            -print

      # ============================================================
      # VERIFY PE EXECUTABLE
      # ============================================================

      - name: Verify Windows executable
        run: |
          EXE="$(find . -type f -iname 'jollygood.exe' | head -n 1)"

          if [ -z "$EXE" ]; then
            EXE="$(find . -type f -iname 'jollygood' | head -n 1)"
          fi

          if [ -z "$EXE" ]; then
            echo "ERROR: jollygood.exe was not produced."
            exit 1
          fi

          echo "Found:"
          echo "$EXE"

          echo "===== file ====="
          file "$EXE"

          echo "===== MinGW dependencies ====="
          x86_64-w64-mingw32-objdump -p "$EXE" | \
            grep "DLL Name" || true

          mkdir -p artifact

          cp "$EXE" artifact/jollygood.exe

      # ============================================================
      # COPY REQUIRED DLLS
      # ============================================================

      - name: Collect MinGW runtime DLLs
        run: |
          EXE="artifact/jollygood.exe"

          echo "Collecting runtime DLLs..."

          for DLL in \
            libgcc_s_seh-1.dll \
            libstdc++-6.dll \
            libwinpthread-1.dll
          do
            FOUND="$(find /usr -name "$DLL" 2>/dev/null | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              echo "Copying $FOUND"
              cp "$FOUND" artifact/
            fi
          done

          echo "Artifact contents:"
          ls -lah artifact/

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Jollygood Windows build
        uses: actions/upload-artifact@v4
        with:
          name: jollygood-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
