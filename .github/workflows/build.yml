name: Build Jollygood Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    name: Jollygood Windows x64
    runs-on: ubuntu-22.04

    env:
      PREFIX: ${{ github.workspace }}/local
      JG_SOURCE: ${{ github.workspace }}/jg
      EPOXY_SOURCE: ${{ github.workspace }}/epoxy
      SDL_SOURCE: ${{ github.workspace }}/SDL
      SPEEX_SOURCE: ${{ github.workspace }}/speexdsp

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout Jollygood
        uses: actions/checkout@v4

      # ============================================================
      # TOOLS
      # ============================================================

      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            make \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ninja-build \
            meson \
            python3 \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64

      # ============================================================
      # DIRECTORIES
      # ============================================================

      - name: Create directories
        run: |
          mkdir -p "$PREFIX/bin"
          mkdir -p "$PREFIX/include"
          mkdir -p "$PREFIX/lib"
          mkdir -p "$PREFIX/lib/pkgconfig"
          mkdir -p "$PREFIX/share/pkgconfig"

      # ============================================================
      # CREATE MESON CROSS FILE
      # ============================================================

      - name: Create MinGW Meson cross file
        run: |
          cat > "$GITHUB_WORKSPACE/meson-mingw.ini" <<EOF
          [binaries]
          c = 'x86_64-w64-mingw32-gcc'
          cpp = 'x86_64-w64-mingw32-g++'
          ar = 'x86_64-w64-mingw32-ar'
          strip = 'x86_64-w64-mingw32-strip'
          windres = 'x86_64-w64-mingw32-windres'
          pkgconfig = 'pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'windows'
          cpu_family = 'x86_64'
          cpu = 'x86_64'
          endian = 'little'
          EOF

          echo "======================================"
          echo "MESON CROSS FILE"
          echo "======================================"

          cat "$GITHUB_WORKSPACE/meson-mingw.ini"

      # ============================================================
      # VERIFY CROSS FILE
      # ============================================================

      - name: Verify cross file
        run: |
          test -f "$GITHUB_WORKSPACE/meson-mingw.ini"

          ls -l "$GITHUB_WORKSPACE/meson-mingw.ini"

      # ============================================================
      # CONFIGURE PKG-CONFIG
      # ============================================================

      - name: Configure pkg-config
        run: |
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_LIBDIR=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" >> "$GITHUB_ENV"

      # ============================================================
      # BUILD JG
      # ============================================================

      - name: Clone JG
        run: |
          git clone \
            --depth 1 \
            https://gitlab.com/jgemu/jg.git \
            "$JG_SOURCE"

      - name: Build JG
        run: |
          cd "$JG_SOURCE"

          make clean || true

          make \
            CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            RANLIB=x86_64-w64-mingw32-ranlib \
            STRIP=x86_64-w64-mingw32-strip

      - name: Install JG
        run: |
          cd "$JG_SOURCE"

          make install \
            PREFIX="$PREFIX" \
            CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            RANLIB=x86_64-w64-mingw32-ranlib \
            STRIP=x86_64-w64-mingw32-strip

      # ============================================================
      # VERIFY JG
      # ============================================================

      - name: Verify JG
        run: |
          echo "JG pkg-config files:"

          find "$PREFIX" \
            -name "jg.pc" \
            -print

          pkg-config --modversion jg

          pkg-config --cflags jg

      # ============================================================
      # BUILD LIBEPOXY
      # ============================================================

      - name: Clone libepoxy
        run: |
          git clone \
            --depth 1 \
            https://github.com/anholt/libepoxy.git \
            "$EPOXY_SOURCE"

      - name: Build libepoxy
        run: |
          cd "$EPOXY_SOURCE"

          rm -rf build

          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/meson-mingw.ini" \
            --prefix="$PREFIX" \
            -Dtests=false

          meson compile \
            -C build

          meson install \
            -C build

      # ============================================================
      # VERIFY EPOXY
      # ============================================================

      - name: Verify libepoxy
        run: |
          echo "Searching for epoxy.pc..."

          find "$PREFIX" \
            -name "epoxy.pc" \
            -print

          pkg-config --modversion epoxy

      # ============================================================
      # BUILD SDL3
      # ============================================================

      - name: Clone SDL3
        run: |
          git clone \
            --depth 1 \
            https://github.com/libsdl-org/SDL.git \
            "$SDL_SOURCE"

      - name: Build SDL3
        run: |
          cd "$SDL_SOURCE"

          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF

          cmake --build build
          cmake --install build

      # ============================================================
      # VERIFY SDL3
      # ============================================================

      - name: Verify SDL3
        run: |
          echo "SDL3 headers:"

          find "$PREFIX/include" \
            -path "*SDL3/SDL.h" \
            -print

          echo
          echo "SDL3 pkg-config:"

          find "$PREFIX" \
            -name "sdl3.pc" \
            -print

          pkg-config --modversion sdl3

          pkg-config --cflags sdl3

      # ============================================================
      # BUILD SPEEXDSP
      # ============================================================

      - name: Clone SpeexDSP
        run: |
          git clone \
            --depth 1 \
            https://gitlab.com/freedesktop-sdk/mirrors/xiph/speexdsp.git \
            "$SPEEX_SOURCE"

      - name: Build SpeexDSP
        run: |
          cd "$SPEEX_SOURCE"

          ./autogen.sh

          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"

          make install

      # ============================================================
      # VERIFY SPEEXDSP
      # ============================================================

      - name: Verify SpeexDSP
        run: |
          echo "SpeexDSP pkg-config:"

          find "$PREFIX" \
            -name "speexdsp.pc" \
            -print

          pkg-config --modversion speexdsp

      # ============================================================
      # SHOW ALL DEPENDENCIES
      # ============================================================

      - name: Verify all dependencies
        run: |
          echo "======================================"
          echo "JG"
          echo "======================================"

          pkg-config --modversion jg
          pkg-config --cflags jg
          pkg-config --libs jg

          echo "======================================"
          echo "EPOXY"
          echo "======================================"

          pkg-config --modversion epoxy
          pkg-config --cflags epoxy
          pkg-config --libs epoxy

          echo "======================================"
          echo "SDL3"
          echo "======================================"

          pkg-config --modversion sdl3
          pkg-config --cflags sdl3
          pkg-config --libs sdl3

          echo "======================================"
          echo "SPEEXDSP"
          echo "======================================"

          pkg-config --modversion speexdsp
          pkg-config --cflags speexdsp
          pkg-config --libs speexdsp

      # ============================================================
      # CLEAN JOLLYGOOD
      # ============================================================

      - name: Clean Jollygood
        run: |
          make clean || true
          rm -rf objs
          rm -rf shaders

      # ============================================================
      # BUILD JOLLYGOOD
      # ============================================================

      - name: Build Jollygood
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          AR: x86_64-w64-mingw32-ar
          LD: x86_64-w64-mingw32-ld
          RANLIB: x86_64-w64-mingw32-ranlib
          STRIP: x86_64-w64-mingw32-strip
          PKG_CONFIG: pkg-config
          PKG_CONFIG_PATH: ${{ github.workspace }}/local/lib/pkgconfig:${{ github.workspace }}/local/share/pkgconfig

        run: |
          echo "======================================"
          echo "BUILD JOLLYGOOD"
          echo "======================================"

          pkg-config --modversion jg
          pkg-config --modversion epoxy
          pkg-config --modversion sdl3
          pkg-config --modversion speexdsp

          echo
          echo "SDL3 header:"
          test -f "$PREFIX/include/SDL3/SDL.h"

          make \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            LD="$LD" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            PKG_CONFIG="$PKG_CONFIG"

      # ============================================================
      # FIND EXECUTABLE
      # ============================================================

      - name: Find Jollygood executable
        run: |
          echo "Searching..."

          find . \
            -type f \
            \( \
              -iname "jollygood.exe" \
              -o \
              -iname "jollygood" \
            \) \
            -print

      # ============================================================
      # VERIFY
      # ============================================================

      - name: Verify Windows executable
        run: |
          EXE="$(find . -type f -iname 'jollygood.exe' | head -n 1)"

          if [ -z "$EXE" ]; then
            EXE="$(find . -type f -iname 'jollygood' | head -n 1)"
          fi

          if [ -z "$EXE" ]; then
            echo "ERROR: jollygood.exe was not produced."
            exit 1
          fi

          echo "======================================"
          echo "FOUND JOLLYGOOD"
          echo "======================================"

          file "$EXE"

          echo
          echo "DLL dependencies:"

          x86_64-w64-mingw32-objdump -p "$EXE" |
            grep "DLL Name" || true

          mkdir -p artifact

          cp "$EXE" artifact/jollygood.exe

      # ============================================================
      # COLLECT DLLS
      # ============================================================

      - name: Collect Windows DLLs
        run: |
          echo "Collecting dependency DLLs..."

          find "$PREFIX/bin" \
            -type f \
            -iname "*.dll" \
            -exec cp {} artifact/ \; || true

          find "$PREFIX/lib" \
            -type f \
            -iname "*.dll" \
            -exec cp {} artifact/ \; || true

          for DLL in \
            libgcc_s_seh-1.dll \
            libstdc++-6.dll \
            libwinpthread-1.dll
          do
            FOUND="$(find /usr -name "$DLL" 2>/dev/null | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              cp "$FOUND" artifact/
            fi
          done

          echo "======================================"
          echo "ARTIFACT"
          echo "======================================"

          ls -lah artifact/

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Jollygood Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: jollygood-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
