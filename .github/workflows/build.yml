name: Build JGRF 2.0.1 Windows x64

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download JGRF 2.0.1
        shell: powershell
        run: |
          Invoke-WebRequest `
            -Uri "https://mirrors.mit.edu/gentoo-distfiles/distfiles/67/jgrf-2.0.1.tar.bz2" `
            -OutFile "jgrf-2.0.1.tar.bz2"

      - name: Extract JGRF
        shell: powershell
        run: |
          7z x jgrf-2.0.1.tar.bz2
          7z x jgrf-2.0.1.tar
          Rename-Item jgrf-2.0.1 jgrf

      - name: Setup MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            git
            pkgconf
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-sdl3
            mingw-w64-ucrt-x86_64-speexdsp
            mingw-w64-ucrt-x86_64-libepoxy
            mingw-w64-ucrt-x86_64-vulkan-headers
            mingw-w64-ucrt-x86_64-vulkan-loader
            mingw-w64-ucrt-x86_64-glslang

      - name: Build JGRF
        shell: msys2 {0}
        working-directory: jgrf
        run: |
          make clean || true
          make ENABLE_VULKAN=1 -j$(nproc)

      - name: Verify executable
        shell: msys2 {0}
        working-directory: jgrf
        run: |
          file jollygood.exe
          ls -lh jollygood.exe
          ls -lh shaders/

      - name: Package
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path artifact
          Copy-Item jgrf\jollygood.exe artifact\
          Copy-Item jgrf\shaders artifact\shaders -Recurse

      - name: Upload jollygood.exe
        uses: actions/upload-artifact@v4
        with:
          name: jollygood-2.0.1-windows-x64-vulkan
          path: artifact
