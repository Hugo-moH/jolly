name: Build Jollygood

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Jollygood
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            make \
            pkg-config \
            git \
            autoconf \
            automake \
            libtool \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxi-dev \
            libxinerama-dev \
            libxcursor-dev \
            libasound2-dev \
            libpulse-dev \
            libudev-dev \
            zlib1g-dev \
            libminizip-dev \
            libflac-dev \
            libsamplerate0-dev \
            libvorbis-dev \
            libogg-dev

      # ------------------------------------------------------------
      # Build/install Jolly Good API (jg)
      # ------------------------------------------------------------

      - name: Clone Jolly Good API
        run: |
          git clone --depth 1 https://gitlab.com/jgemu/jg.git "$HOME/jg"

      - name: Install Jolly Good API
        working-directory: ${{ env.HOME }}/jg
        run: |
          make install \
            PREFIX="$HOME/jollygood-prefix"

      - name: Verify jg.pc
        run: |
          echo "Searching for jg.pc..."
          find "$HOME/jollygood-prefix" -name "jg.pc" -print

      - name: Configure pkg-config
        run: |
          echo "PKG_CONFIG_PATH=$HOME/jollygood-prefix/lib/pkgconfig:$HOME/jollygood-prefix/share/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"

          echo "LD_LIBRARY_PATH=$HOME/jollygood-prefix/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Verify Jolly Good API
        run: |
          echo "PKG_CONFIG_PATH=$PKG_CONFIG_PATH"

          pkg-config --modversion jg

          echo "----- jg cflags -----"
          pkg-config --cflags jg

          echo "----- jg libs -----"
          pkg-config --libs jg

      # ------------------------------------------------------------
      # Build/install Jolly Good Reference Frontend (jgrf)
      # ------------------------------------------------------------

      - name: Clone Jolly Good Reference Frontend
        run: |
          git clone --depth 1 https://gitlab.com/jgemu/jgrf.git "$HOME/jgrf"

      - name: Build JGRF
        working-directory: ${{ env.HOME }}/jgrf
        run: |
          make

      - name: Install JGRF
        working-directory: ${{ env.HOME }}/jgrf
        run: |
          make install \
            PREFIX="$HOME/jollygood-prefix"

      - name: Verify JGRF installation
        run: |
          find "$HOME/jollygood-prefix" \
            -maxdepth 4 \
            -type f \
            -print | sort

      # ------------------------------------------------------------
      # Configure Jollygood
      # ------------------------------------------------------------

      - name: Show compiler and pkg-config information
        run: |
          gcc --version
          g++ --version
          make --version
          pkg-config --version

          echo "===== jg ====="
          pkg-config --modversion jg
          pkg-config --cflags jg
          pkg-config --libs jg

      - name: Clean previous build
        run: |
          make clean || true
          rm -rf objs
          rm -rf shaders

      # ------------------------------------------------------------
      # Build Jollygood
      # ------------------------------------------------------------

      - name: Build Jollygood
        env:
          PREFIX: ${{ github.workspace }}/install
        run: |
          make \
            CC=gcc \
            CFLAGS="-O2 -std=c99 -Wall -Wextra -Wshadow -Wmissing-declarations -Wmissing-prototypes -pedantic" \
            PKG_CONFIG=pkg-config

      # ------------------------------------------------------------
      # Find executable
      # ------------------------------------------------------------

      - name: Locate Jollygood executable
        run: |
          echo "Searching for jollygood executable..."

          find . \
            -type f \
            \( \
              -name "jollygood" \
              -o \
              -name "jollygood.exe" \
            \) \
            -print

      - name: Check build output
        run: |
          if find . -type f -name "jollygood" | grep -q .; then
            echo "Jollygood executable found."
          elif find . -type f -name "jollygood.exe" | grep -q .; then
            echo "Jollygood.exe found."
          else
            echo "ERROR: Jollygood executable was not produced."
            exit 1
          fi

      # ------------------------------------------------------------
      # Collect files
      # ------------------------------------------------------------

      - name: Prepare artifact
        run: |
          mkdir -p artifact

          find . \
            -type f \
            \( \
              -name "jollygood" \
              -o \
              -name "jollygood.exe" \
            \) \
            -exec cp {} artifact/ \;

          echo "Artifact contents:"
          find artifact -type f -ls

      # ------------------------------------------------------------
      # Upload GitHub Actions artifact
      # ------------------------------------------------------------

      - name: Upload Jollygood
        uses: actions/upload-artifact@v4
        with:
          name: jollygood-build
          path: artifact/
          if-no-files-found: error
