name: Build Jollygood Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    name: Build Jollygood Windows x64
    runs-on: ubuntu-22.04

    env:
      PREFIX: ${{ github.workspace }}/local
      JG_SOURCE: ${{ github.workspace }}/jg
      JGRF_SOURCE: ${{ github.workspace }}/jgrf
      HOST: x86_64-w64-mingw32

    steps:

      # ============================================================
      # CHECKOUT JOLLYGOOD
      # ============================================================

      - name: Checkout Jollygood
        uses: actions/checkout@v4

      # ============================================================
      # INSTALL BUILD TOOLS
      # ============================================================

      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            make \
            pkg-config \
            git \
            autoconf \
            automake \
            libtool \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64 \
            mingw-w64-tools \
            nsis

      # ============================================================
      # SHOW ENVIRONMENT
      # ============================================================

      - name: Show build environment
        run: |
          echo "Workspace:"
          echo "$GITHUB_WORKSPACE"

          echo "Prefix:"
          echo "$PREFIX"

          echo "JG source:"
          echo "$JG_SOURCE"

          echo "Compiler:"
          x86_64-w64-mingw32-gcc --version

          echo "C++ compiler:"
          x86_64-w64-mingw32-g++ --version

      # ============================================================
      # CREATE DIRECTORIES
      # ============================================================

      - name: Create build directories
        run: |
          mkdir -p "$PREFIX/bin"
          mkdir -p "$PREFIX/lib"
          mkdir -p "$PREFIX/include"
          mkdir -p "$PREFIX/lib/pkgconfig"
          mkdir -p "$PREFIX/share/pkgconfig"

      # ============================================================
      # CLONE JG
      # ============================================================

      - name: Clone Jolly Good API
        run: |
          rm -rf "$JG_SOURCE"

          git clone \
            --depth 1 \
            https://gitlab.com/jgemu/jg.git \
            "$JG_SOURCE"

          echo "JG source:"
          ls -la "$JG_SOURCE"

      # ============================================================
      # CHECK JG MAKEFILE
      # ============================================================

      - name: Inspect JG
        run: |
          cd "$JG_SOURCE"

          echo "======================================"
          echo "JG DIRECTORY"
          echo "======================================"

          pwd
          ls -la

          echo "======================================"
          echo "JG MAKEFILE"
          echo "======================================"

          if [ -f Makefile ]; then
            sed -n '1,260p' Makefile
          else
            echo "No Makefile found."
          fi

      # ============================================================
      # BUILD JG
      # ============================================================

      - name: Build JG
        run: |
          cd "$JG_SOURCE"

          echo "Building JG..."

          make clean || true

          make \
            CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            RANLIB=x86_64-w64-mingw32-ranlib \
            STRIP=x86_64-w64-mingw32-strip

      # ============================================================
      # INSTALL JG
      # ============================================================

      - name: Install JG
        run: |
          cd "$JG_SOURCE"

          echo "Installing JG..."

          make install \
            PREFIX="$PREFIX" \
            CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            RANLIB=x86_64-w64-mingw32-ranlib \
            STRIP=x86_64-w64-mingw32-strip

      # ============================================================
      # FIND JG FILES
      # ============================================================

      - name: Find JG installation
        run: |
          echo "======================================"
          echo "JG INSTALLATION"
          echo "======================================"

          find "$PREFIX" \
            -maxdepth 5 \
            -type f \
            -print | sort

          echo "======================================"
          echo "SEARCHING FOR jg.pc"
          echo "======================================"

          find "$PREFIX" \
            -name "jg.pc" \
            -print

      # ============================================================
      # CONFIGURE PKG-CONFIG
      # ============================================================

      - name: Configure pkg-config
        run: |
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" >> "$GITHUB_ENV"

          echo "PATH=$PREFIX/bin:$PATH" >> "$GITHUB_ENV"

          echo "Configured:"
          echo "$PREFIX/lib/pkgconfig"
          echo "$PREFIX/share/pkgconfig"

      # ============================================================
      # VERIFY JG
      # ============================================================

      - name: Verify JG pkg-config
        run: |
          echo "======================================"
          echo "PKG_CONFIG_PATH"
          echo "======================================"

          echo "$PKG_CONFIG_PATH"

          echo "======================================"
          echo "JG PC FILE"
          echo "======================================"

          find "$PREFIX" -name "jg.pc" -print

          echo "======================================"
          echo "PKG-CONFIG SEARCH"
          echo "======================================"

          pkg-config --debug --modversion jg

          echo "======================================"
          echo "JG CFLAGS"
          echo "======================================"

          pkg-config --cflags jg

          echo "======================================"
          echo "JG LIBS"
          echo "======================================"

          pkg-config --libs jg

      # ============================================================
      # CLEAN JOLLYGOOD
      # ============================================================

      - name: Clean Jollygood
        run: |
          make clean || true

          rm -rf objs
          rm -rf shaders

      # ============================================================
      # BUILD JOLLYGOOD
      # ============================================================

      - name: Build Jollygood
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          AR: x86_64-w64-mingw32-ar
          LD: x86_64-w64-mingw32-ld
          RANLIB: x86_64-w64-mingw32-ranlib
          STRIP: x86_64-w64-mingw32-strip
          PKG_CONFIG: pkg-config

        run: |
          echo "======================================"
          echo "BUILD JOLLYGOOD"
          echo "======================================"

          pkg-config --modversion jg

          pkg-config --cflags jg

          pkg-config --libs jg

          make \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            LD="$LD" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            PKG_CONFIG="$PKG_CONFIG"

      # ============================================================
      # FIND EXE
      # ============================================================

      - name: Find executable
        run: |
          echo "======================================"
          echo "SEARCHING FOR EXECUTABLE"
          echo "======================================"

          find . \
            -type f \
            \( \
              -iname "jollygood.exe" \
              -o \
              -iname "jollygood" \
            \) \
            -print

      # ============================================================
      # VERIFY EXE
      # ============================================================

      - name: Verify Windows executable
        run: |
          EXE="$(find . -type f -iname 'jollygood.exe' | head -n 1)"

          if [ -z "$EXE" ]; then
            EXE="$(find . -type f -iname 'jollygood' | head -n 1)"
          fi

          if [ -z "$EXE" ]; then
            echo "ERROR: jollygood.exe was not created."
            exit 1
          fi

          echo "======================================"
          echo "JOLLYGOOD FOUND"
          echo "======================================"

          echo "$EXE"

          file "$EXE"

          mkdir -p artifact

          cp "$EXE" artifact/jollygood.exe

      # ============================================================
      # COLLECT MINGW DLLS
      # ============================================================

      - name: Collect runtime DLLs
        run: |
          echo "Collecting MinGW runtime DLLs..."

          for DLL in \
            libgcc_s_seh-1.dll \
            libstdc++-6.dll \
            libwinpthread-1.dll
          do

            FOUND="$(find /usr -name "$DLL" 2>/dev/null | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              echo "Found $DLL:"
              echo "$FOUND"

              cp "$FOUND" artifact/
            fi

          done

          echo "======================================"
          echo "FINAL ARTIFACT"
          echo "======================================"

          ls -lah artifact/

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Jollygood Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: jollygood-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
