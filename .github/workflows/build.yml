name: Build Jollygood Windows x64

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-windows:
    name: Jollygood Windows x64
    runs-on: ubuntu-22.04

    env:
      PREFIX: ${{ github.workspace }}/local
      JG_SOURCE: ${{ github.workspace }}/jg
      EPOXY_SOURCE: ${{ github.workspace }}/epoxy
      SDL_SOURCE: ${{ github.workspace }}/SDL
      SPEEX_SOURCE: ${{ github.workspace }}/speexdsp

      HOST: x86_64-w64-mingw32

    steps:

      # ============================================================
      # CHECKOUT JOLLYGOOD
      # ============================================================

      - name: Checkout Jollygood
        uses: actions/checkout@v4

      # ============================================================
      # HOST BUILD DEPENDENCIES
      # ============================================================

      - name: Install build tools
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            make \
            pkg-config \
            autoconf \
            automake \
            libtool \
            cmake \
            ninja-build \
            meson \
            python3 \
            python3-pip \
            mingw-w64 \
            gcc-mingw-w64-x86-64 \
            g++-mingw-w64-x86-64 \
            binutils-mingw-w64-x86-64

      # ============================================================
      # CREATE PREFIX
      # ============================================================

      - name: Create installation prefix
        run: |
          mkdir -p "$PREFIX/bin"
          mkdir -p "$PREFIX/include"
          mkdir -p "$PREFIX/lib"
          mkdir -p "$PREFIX/lib/pkgconfig"
          mkdir -p "$PREFIX/share/pkgconfig"

      # ============================================================
      # CROSS COMPILER
      # ============================================================

      - name: Verify MinGW
        run: |
          x86_64-w64-mingw32-gcc --version
          x86_64-w64-mingw32-g++ --version
          x86_64-w64-mingw32-ar --version
          x86_64-w64-mingw32-ranlib --version
          x86_64-w64-mingw32-strip --version

      # ============================================================
      # CROSS PKG-CONFIG
      # ============================================================

      - name: Configure cross pkg-config
        run: |
          CROSS_PKG_CONFIG="$GITHUB_WORKSPACE/cross-pkg-config"

          cat > "$CROSS_PKG_CONFIG" <<'EOF'
          #!/bin/sh

          export PKG_CONFIG_PATH="$GITHUB_WORKSPACE/local/lib/pkgconfig:$GITHUB_WORKSPACE/local/share/pkgconfig"
          export PKG_CONFIG_LIBDIR="$GITHUB_WORKSPACE/local/lib/pkgconfig:$GITHUB_WORKSPACE/local/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR=""

          exec pkg-config "$@"
          EOF

          chmod +x "$CROSS_PKG_CONFIG"

          echo "CROSS_PKG_CONFIG=$CROSS_PKG_CONFIG" >> "$GITHUB_ENV"

          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" >> "$GITHUB_ENV"

      # ============================================================
      # BUILD JG
      # ============================================================

      - name: Clone JG
        run: |
          rm -rf "$JG_SOURCE"

          git clone \
            --depth 1 \
            https://gitlab.com/jgemu/jg.git \
            "$JG_SOURCE"

      - name: Build JG
        run: |
          cd "$JG_SOURCE"

          make clean || true

          make \
            CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            RANLIB=x86_64-w64-mingw32-ranlib \
            STRIP=x86_64-w64-mingw32-strip

      - name: Install JG
        run: |
          cd "$JG_SOURCE"

          make install \
            PREFIX="$PREFIX" \
            CC=x86_64-w64-mingw32-gcc \
            AR=x86_64-w64-mingw32-ar \
            RANLIB=x86_64-w64-mingw32-ranlib \
            STRIP=x86_64-w64-mingw32-strip

      - name: Verify JG
        run: |
          find "$PREFIX" -name "jg.pc" -print

          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            pkg-config --modversion jg

      # ============================================================
      # BUILD LIBEPOXY
      # ============================================================

      - name: Clone libepoxy
        run: |
          rm -rf "$EPOXY_SOURCE"

          git clone \
            --depth 1 \
            https://github.com/anholt/libepoxy.git \
            "$EPOXY_SOURCE"

      - name: Build libepoxy
        run: |
          cd "$EPOXY_SOURCE"

          rm -rf build

          meson setup build \
            --cross-file "$GITHUB_WORKSPACE/meson-mingw.ini" \
            --prefix="$PREFIX" \
            -Dtests=false

          meson compile \
            -C build

      # ============================================================
      # BUILD SDL3
      # ============================================================

      - name: Clone SDL3
        run: |
          rm -rf "$SDL_SOURCE"

          git clone \
            --depth 1 \
            https://github.com/libsdl-org/SDL.git \
            "$SDL_SOURCE"

      - name: Build SDL3
        run: |
          cd "$SDL_SOURCE"

          rm -rf build

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_SYSTEM_NAME=Windows \
            -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc \
            -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++ \
            -DCMAKE_RC_COMPILER=x86_64-w64-mingw32-windres \
            -DCMAKE_INSTALL_PREFIX="$PREFIX" \
            -DSDL_TESTS=OFF \
            -DSDL_EXAMPLES=OFF \
            -DSDL_SHARED=ON \
            -DSDL_STATIC=OFF

          cmake \
            --build build

          cmake \
            --install build

      # ============================================================
      # BUILD SPEEXDSP
      # ============================================================

      - name: Clone SpeexDSP
        run: |
          rm -rf "$SPEEX_SOURCE"

          git clone \
            --depth 1 \
            https://gitlab.com/freedesktop-sdk/mirrors/xiph/speexdsp.git \
            "$SPEEX_SOURCE"

      - name: Build SpeexDSP
        run: |
          cd "$SPEEX_SOURCE"

          ./autogen.sh

          ./configure \
            --host=x86_64-w64-mingw32 \
            --prefix="$PREFIX" \
            --disable-shared \
            --enable-static

          make -j"$(nproc)"

          make install

      # ============================================================
      # SHOW ALL PC FILES
      # ============================================================

      - name: Verify dependency packages
        run: |
          echo "=========================================="
          echo "PKG-CONFIG FILES"
          echo "=========================================="

          find "$PREFIX" \
            -name "*.pc" \
            -print | sort

          echo
          echo "=========================================="
          echo "JG"
          echo "=========================================="

          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            pkg-config --modversion jg

          echo
          echo "=========================================="
          echo "EPOXY"
          echo "=========================================="

          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            pkg-config --modversion epoxy

          echo
          echo "=========================================="
          echo "SDL3"
          echo "=========================================="

          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            pkg-config --modversion sdl3

          echo
          echo "=========================================="
          echo "SPEEXDSP"
          echo "=========================================="

          PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig" \
            pkg-config --modversion speexdsp

      # ============================================================
      # DISPLAY FLAGS
      # ============================================================

      - name: Show dependency flags
        run: |
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/share/pkgconfig"

          echo "JG:"
          pkg-config --cflags --libs jg

          echo
          echo "EPOXY:"
          pkg-config --cflags --libs epoxy

          echo
          echo "SDL3:"
          pkg-config --cflags --libs sdl3

          echo
          echo "SPEEXDSP:"
          pkg-config --cflags --libs speexdsp

      # ============================================================
      # CLEAN JOLLYGOOD
      # ============================================================

      - name: Clean Jollygood
        run: |
          make clean || true
          rm -rf objs
          rm -rf shaders

      # ============================================================
      # BUILD JOLLYGOOD
      # ============================================================

      - name: Build Jollygood
        env:
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          AR: x86_64-w64-mingw32-ar
          LD: x86_64-w64-mingw32-ld
          RANLIB: x86_64-w64-mingw32-ranlib
          STRIP: x86_64-w64-mingw32-strip
          PKG_CONFIG: pkg-config
          PKG_CONFIG_PATH: ${{ github.workspace }}/local/lib/pkgconfig:${{ github.workspace }}/local/share/pkgconfig

        run: |
          echo "=========================================="
          echo "BUILD JOLLYGOOD"
          echo "=========================================="

          echo "JG:"
          pkg-config --modversion jg

          echo "EPOXY:"
          pkg-config --modversion epoxy

          echo "SDL3:"
          pkg-config --modversion sdl3

          echo "SPEEXDSP:"
          pkg-config --modversion speexdsp

          echo
          echo "SDL3 headers:"
          find "$PREFIX/include/SDL3" -maxdepth 1 -type f | head -20

          echo
          echo "Starting make..."

          make \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            LD="$LD" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP" \
            PKG_CONFIG="$PKG_CONFIG"

      # ============================================================
      # FIND JOLLYGOOD
      # ============================================================

      - name: Locate Jollygood
        run: |
          echo "=========================================="
          echo "SEARCHING FOR JOLLYGOOD"
          echo "=========================================="

          find . \
            -type f \
            \( \
              -iname "jollygood.exe" \
              -o \
              -iname "jollygood" \
            \) \
            -print

      # ============================================================
      # VERIFY WINDOWS EXE
      # ============================================================

      - name: Verify executable
        run: |
          EXE="$(find . -type f -iname 'jollygood.exe' | head -n 1)"

          if [ -z "$EXE" ]; then
            EXE="$(find . -type f -iname 'jollygood' | head -n 1)"
          fi

          if [ -z "$EXE" ]; then
            echo "ERROR: jollygood.exe was not created."
            exit 1
          fi

          echo "Found:"
          echo "$EXE"

          echo
          echo "FILE:"
          file "$EXE"

          echo
          echo "DLL DEPENDENCIES:"
          x86_64-w64-mingw32-objdump -p "$EXE" |
            grep "DLL Name" || true

          mkdir -p artifact

          cp "$EXE" artifact/jollygood.exe

      # ============================================================
      # COPY DLLS
      # ============================================================

      - name: Collect runtime DLLs
        run: |
          echo "Collecting DLLs..."

          find "$PREFIX/bin" \
            -type f \
            -iname "*.dll" \
            -exec cp {} artifact/ \; || true

          find "$PREFIX/lib" \
            -type f \
            -iname "*.dll" \
            -exec cp {} artifact/ \; || true

          for DLL in \
            libgcc_s_seh-1.dll \
            libstdc++-6.dll \
            libwinpthread-1.dll
          do
            FOUND="$(find /usr -name "$DLL" 2>/dev/null | head -n 1 || true)"

            if [ -n "$FOUND" ]; then
              cp "$FOUND" artifact/
            fi
          done

      # ============================================================
      # FINAL ARTIFACT
      # ============================================================

      - name: Show final artifact
        run: |
          echo "=========================================="
          echo "FINAL JOLLYGOOD PACKAGE"
          echo "=========================================="

          ls -lah artifact/

      # ============================================================
      # UPLOAD
      # ============================================================

      - name: Upload Jollygood Windows x64
        uses: actions/upload-artifact@v4
        with:
          name: jollygood-windows-x64
          path: artifact/
          if-no-files-found: error
          retention-days: 30
